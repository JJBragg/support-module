# closed_at and solved_at are always supplied, including as null. A ticket
# that moves back out of a closed or solved status should not keep the
# timestamp that says it is still there, and record_update clearing a
# property on an explicit null is exactly that behaviour.
mutation (
  $id: ID!
  $status_id: String!
  $closed_at: String
  $solved_at: String
) {
  record: record_update(
    id: $id
    record: {
      table: "modules/support/ticket"
      properties: [
        { name: "status_id", value: $status_id }
        { name: "closed_at", value: $closed_at }
        { name: "solved_at", value: $solved_at }
      ]
    }
  ) {
    id
    type: table

    status_id: property(name: "status_id")
    closed_at: property(name: "closed_at")
    solved_at: property(name: "solved_at")
  }
}
