mutation (
  $email: String!
  $name: String
  $organization: String
  $c__names: String
  $emails: [String!]
  $c__emails: String
) {
  record: record_create(
    record: {
      table: "modules/support/contact"
      properties: [
        { name: "email", value: $email }
        { name: "name", value: $name }
        { name: "organization", value: $organization }
        { name: "c__names", value: $c__names }
        { name: "emails", value_array: $emails }
        { name: "c__emails", value: $c__emails }
      ]
    }
  ) {
    id
    type: table

    email: property(name: "email")
    name: property(name: "name")
    organization: property(name: "organization")
    emails: property_array(name: "emails")
  }
}
