en:
  settings:
    title: Settings
    subtitle: Changes apply to the whole team as soon as they are saved.
    back_to_tickets: Back to tickets
    save: Save
    rename: Rename

    fields:
      name: Name
      slug: Name
      inbound_address: Inbound address
      from_address: From address
      from_name: Sender name
      signature: Signature
      key: Name
      kind: Type
      role: Role
      email: Email
      title: Job title
      department_ids: Departments

    departments:
      heading: Departments
      subtitle: Each department has its own inbox, sending address and signature.
      add: Add department
      edit: Edit
      done: Done
      name: Name
      from_name: Sender name
      inbound: Inbound address
      inbound_hint: Customer emails sent here create or update tickets in %{name}.
      from: From address
      from_hint: Replies go out from this address. It has to be verified with your email provider.
      signature: Signature
      not_set: Not set

    statuses:
      heading: Statuses
      subtitle: This order is used in the sidebar, in Group by status and in every status menu.
      add: Add status
      order: Order
      name: Name
      kind: Type
      kind_for: Type for %{name}
      kind_open: Open
      kind_on_hold: On hold
      kind_closed: Closed
