name: message
properties:
  - name: ticket_id
    type: string

  # inbound, outbound or note. A note is never emailed.
  - name: kind
    type: string

  # Author: contact_id for inbound, user_id for outbound and notes.
  - name: contact_id
    type: string
  - name: user_id
    type: string

  - name: from_address
    type: string
  - name: to_addresses
    type: array
  - name: cc_addresses
    type: array
  - name: subject
    type: string

  - name: body_html
    type: text
  - name: body_text
    type: text

  # The quoted history, split off the new content and collapsed in the UI.
  - name: quoted_html
    type: text

  # Threading. message_id_header is what inbound In-Reply-To is matched on.
  - name: message_id_header
    type: string
  - name: in_reply_to
    type: string
  - name: references
    type: array

  # Outbound only.
  - name: provider_message_id
    type: string
  - name: delivery_status
    type: string

  # Why this message landed on this ticket: headers, subject or new. The
  # threading cascade already works it out; nothing else can reconstruct
  # it afterwards, which is what makes it worth a column.
  - name: match_reason
    type: string

  # The header block as it was posted. Small and bounded, and the only
  # evidence there is when a reply lands on the wrong ticket. The body is
  # not what you debug threading with, so the body is not kept twice.
  - name: raw_headers
    type: text
