name: contact
properties:
  # Lowercased on write. This is the only identity a customer has.
  - name: email
    type: string
  - name: name
    type: string
  - name: organization
    type: string

  # Tokenized name and organization, for contains search.
  - name: c__names
    type: string

  # When this address was last sent an automatic receipt. One field rather
  # than counting past acknowledgements, because the only question ever
  # asked of it is "was it recently", and a loop asks that question
  # hundreds of times an hour.
  - name: last_acknowledged_at
    type: datetime

  # Every address this person writes in from. The one above is the primary
  # and is always in here too. Someone who mails from their phone and then
  # their laptop is one customer, not two, and which address each client
  # uses is not something they chose.
  - name: emails
    type: array

  # The addresses as <one@x.test> <two@y.test>, for the contains lookup
  # that finds a contact by any of them. Angle brackets so that searching
  # ob@x.test cannot match bob@x.test.
  - name: c__emails
    type: string
