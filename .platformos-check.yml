# platformos-check configuration. Both entries are exclusions.
#
# Fixtures: a test fixture that holds a real Outlook Message-ID, which
# begins <001a01dc... , is not parseable as HTML. The linter reads an angle
# bracket followed by a digit and stops. Fixtures hold mail exactly as
# clients send it, so the choice is to exclude them or to test mail nobody
# sends. They contain no logic, only captured text returned to the tests
# that read them.
#
# Dependency modules: restored by `pos-cli modules install --dev` and not
# ours to fix. They carry deprecation warnings that would otherwise make
# `pos-cli check run .` permanently noisy, and the rule in README and
# docs/status.md is that it must be clean.
ignore:
  - modules/support/public/lib/tests/fixtures/*
  - app/lib/tests/fixtures/*
  - modules/core/**
  - modules/user/**
  - modules/common-styling/**
  - modules/tests/**
